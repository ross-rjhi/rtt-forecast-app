# Serves the built app the way Azure Static Web Apps would:
#   /api/*   -> the API container (SWA: a "linked backend")
#   anything else that isn't a file -> index.html, so links like /overview?org=A01 work
#            (SWA: "navigationFallback" in staticwebapp.config.json)
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
